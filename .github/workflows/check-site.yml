name: Website checks

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --workers=2
      - run: npm audit --audit-level=moderate
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-evidence
          path: test-results/
          retention-days: 7
